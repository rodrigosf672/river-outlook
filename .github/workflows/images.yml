name: images
# Builds both images on x86 runners and pushes them to GHCR.
on:
  push:
    branches: [main]
    paths: ["gateway/**", "frontend/**", "worker/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: river-outlook-gateway
            context: .
            file: gateway/Dockerfile
          - name: river-outlook-worker
            context: worker
            file: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # The worker image is large (CUDA + PyTorch + model weights).
      - name: Free disk space
        if: matrix.name == 'river-outlook-worker'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
